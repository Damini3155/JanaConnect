name: record_linux
description: Stub implementation of record_linux compatible with record_platform_interface 1.6.0. Only used to satisfy Dart compilation on non-Linux targets.
version: 0.7.3

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  record_platform_interface: '>=1.6.0 <2.0.0'

flutter:
  plugin:
    implements: record
    platforms:
      linux:
        dartPluginClass: RecordLinux
        fileName: record_linux.dart
